<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatBot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #212121;
      color: #ececec;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: #171717;
      display: flex;
      flex-direction: column;
      height: 100vh;
      flex-shrink: 0;
    }

    .sidebar-top {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #ececec;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .new-chat-btn:hover { background: #2a2a2a; }

    .new-chat-btn svg {
      width: 18px;
      height: 18px;
      stroke: #ececec;
      fill: none;
      stroke-width: 2;
    }

    .sidebar-section-label {
      padding: 10px 14px 6px;
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-list-item:hover { background: #2a2a2a; }
    .chat-list-item.active { background: #2a2a2a; }

    .chat-list-item .chat-title {
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-list-item .delete-btn {
      display: none;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .chat-list-item:hover .delete-btn { display: block; }
    .chat-list-item .delete-btn:hover { color: #e94560; }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    .main-header {
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #ccc;
    }

    /* ── Welcome screen ── */
    .welcome {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #ececec;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: none;
    }

    .message-row {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 20px;
      width: 100%;
    }

    .message-row .sender {
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ccc;
    }

    .message-row .sender.user-label { color: #ececec; }
    .message-row .sender.bot-label { color: #10a37f; }

    .message-row .text {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #d1d5db;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* ── Input area ── */
    .input-area {
      padding: 16px 20px 24px;
      display: flex;
      justify-content: center;
    }

    .input-wrapper {
      max-width: 720px;
      width: 100%;
      display: flex;
      align-items: center;
      background: #303030;
      border-radius: 24px;
      padding: 4px 8px 4px 20px;
      border: 1px solid #424242;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within { border-color: #555; }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      color: #ececec;
      font-size: 1rem;
      padding: 12px 0;
      outline: none;
    }

    .input-wrapper input::placeholder { color: #888; }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #ececec;
      color: #171717;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .send-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* ── Typing indicator ── */
    .typing-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: #10a37f;
      border-radius: 50%;
      margin-right: 4px;
      animation: blink 1.4s infinite both;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; margin-right: 0; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-top">
      <button class="new-chat-btn" onclick="newChat()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
    </div>
    <div class="sidebar-section-label">Your chats</div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="main-header">ChatBot</div>

    <div class="welcome" id="welcome">
      <h1>What's on your mind today?</h1>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatListEl = document.getElementById("chatList");

    // ── State ──
    let chats = JSON.parse(localStorage.getItem("chats") || "[]");
    let activeChatId = null;

    // ── Init ──
    renderChatList();
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !sendBtn.disabled) sendMessage();
    });

    // ── Chat management ──
    function saveChats() {
      localStorage.setItem("chats", JSON.stringify(chats));
    }

    function getChat(id) {
      return chats.find((c) => c.id === id);
    }

    function newChat() {
      activeChatId = null;
      messagesEl.style.display = "none";
      messagesEl.innerHTML = "";
      welcomeEl.style.display = "flex";
      renderChatList();
      inputEl.focus();
    }

    function createChat(firstMessage) {
      const chat = {
        id: Date.now().toString(),
        title: firstMessage.slice(0, 40),
        messages: [],
      };
      chats.unshift(chat);
      activeChatId = chat.id;
      saveChats();
      renderChatList();
      return chat;
    }

    function deleteChat(id, e) {
      e.stopPropagation();
      chats = chats.filter((c) => c.id !== id);
      saveChats();
      if (activeChatId === id) newChat();
      renderChatList();
    }

    function loadChat(id) {
      activeChatId = id;
      const chat = getChat(id);
      if (!chat) return;

      welcomeEl.style.display = "none";
      messagesEl.style.display = "block";
      messagesEl.innerHTML = "";

      chat.messages.forEach((m) => appendMessage(m.text, m.role));
      messagesEl.scrollTop = messagesEl.scrollHeight;
      renderChatList();
      inputEl.focus();
    }

    function renderChatList() {
      chatListEl.innerHTML = "";
      chats.forEach((chat) => {
        const item = document.createElement("div");
        item.className = "chat-list-item" + (chat.id === activeChatId ? " active" : "");
        item.innerHTML = `
          <span class="chat-title">${escapeHtml(chat.title)}</span>
          <button class="delete-btn" onclick="deleteChat('${chat.id}', event)">&#x2715;</button>
        `;
        item.onclick = () => loadChat(chat.id);
        chatListEl.appendChild(item);
      });
    }

    // ── Messages ──
    function appendMessage(text, role) {
      const row = document.createElement("div");
      row.className = "message-row";

      const label = role === "user" ? "You" : "ChatBot";
      const labelClass = role === "user" ? "user-label" : "bot-label";

      row.innerHTML = `
        <div class="sender ${labelClass}">${label}</div>
        <div class="text">${escapeHtml(text)}</div>
      `;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "message-row";
      row.id = "typingIndicator";
      row.innerHTML = `
        <div class="sender bot-label">ChatBot</div>
        <div class="text">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      `;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById("typingIndicator");
      if (el) el.remove();
    }

    // ── Send ──
    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      // Create new chat if none active
      if (!activeChatId) {
        createChat(message);
        welcomeEl.style.display = "none";
        messagesEl.style.display = "block";
      }

      const chat = getChat(activeChatId);

      appendMessage(message, "user");
      chat.messages.push({ role: "user", text: message });
      saveChats();

      inputEl.value = "";
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        removeTyping();

        const reply = data.error ? "Error: " + data.error : data.reply;
        appendMessage(reply, "bot");
        chat.messages.push({ role: "bot", text: reply });
        saveChats();
      } catch {
        removeTyping();
        const errMsg = "Could not reach the server.";
        appendMessage(errMsg, "bot");
        chat.messages.push({ role: "bot", text: errMsg });
        saveChats();
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    // ── Util ──
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
